name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
    - name: Install fontconfig for slint
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
    - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
    - name: Run checks
      run: cargo check --verbose --all-targets
    - name: Run stern's trybuild tests
      # error message defer depending on whether rust-src component is installed.
      # the difference is not important in the case, so we ignore it here.
      run: TRYBUILD=overwrite cargo test -p stern --test *trybuild* --verbose
    - name: Run tests
      run: cargo test --verbose
