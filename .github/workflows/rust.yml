name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run checks
      run: cargo check --verbose --all-targets
    - name: Run tests
      run: cargo test --verbose
