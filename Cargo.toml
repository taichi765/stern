[workspace]
members = ["stern", "stern_macros"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# workspace members
stern = { path = "./stern" }
stern-macros = { path = "./stern_macros" }

# slint
slint = { git = "https://github.com/taichi765/slint" }
i-slint-backend-testing = { git = "https://github.com/taichi765/slint" }

# utilities
thiserror = "2.0.18"
strum = "0.28.0"
derive_more = "2.1.1"
heck = "0.5.0"
tempfile = "3"
trybuild = "1.0"
parking_lot = "0.12.5"

# async libraries
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3.23"
tokio = "1.52.3"
tokio-util = "0.7.19"
tokio-stream = "0.1.19"

# smol family
smol = "2.0.2"
async-io = "2.6.0"
async-executor = "1.14.0"
async-task = "4.7.1"
